[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulated-eval"
version = "1.0.0"
description = "Regulated LLM Eval Framework — evaluation for LLMs in regulated domains (tax, accounting, legal) with 152-FZ compliance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Regulated LLM Eval Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]

[project.optional-dependencies]
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
streamlit = [
    "streamlit>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-jinja2",
]

[project.scripts]
regulated-eval = "regulated_eval.cli:app"

[project.urls]
Homepage = "https://github.com/regulated-llm-eval/regulated-eval"
Repository = "https://github.com/regulated-llm-eval/regulated-eval"
Documentation = "https://github.com/regulated-llm-eval/regulated-eval#readme"
"Bug Tracker" = "https://github.com/regulated-llm-eval/regulated-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/regulated_eval"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
